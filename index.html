<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piani di carriera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #e8edf3;
      --blue: #2f6fe0;
      --cyan: #3dcedf;
      --gold: #f2c14b;
      --up: #3b82f6;
      --down: #e11d6a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .app { display: flex; height: 100%; min-height: 0; }
    .sidebar {
      width: 252px;
      flex: 0 0 252px;
      background: #fff;
      border-right: 1px solid #eef1f4;
      overflow: auto;
      padding: 14px 10px 28px;
    }
    .nav-parent, .nav-solo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #4b5563;
      font-size: 13.5px;
      font-weight: 600;
    }
    .nav-group.open > .nav-parent { background: #f3f4f6; color: #111827; }
    .nav-children { padding: 4px 0 8px; }
    .nav-child {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 1px 0;
      padding: 7px 10px 7px 18px;
      border-radius: 8px;
      color: #6b7280;
      font-size: 13.5px;
    }
    .nav-child::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #cbd5e1;
      flex: 0 0 auto;
    }
    .nav-child.active { color: #111827; font-weight: 600; }
    .nav-child.active::before { background: #111827; }
    .chevron { margin-left: auto; color: #9ca3af; font-size: 11px; }
    .beta {
      margin-left: 6px;
      background: #e7f0ff;
      color: #3b82f6;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 6px;
    }
    .spark { color: #f59e0b; font-size: 12px; }
    .ico { width: 16px; height: 16px; display: inline-grid; place-items: center; color: #6b7280; }

    .workspace { position: relative; flex: 1; min-width: 0; min-height: 0; padding: 64px 72px 24px 28px; }
    .gear {
      position: absolute;
      top: 14px;
      right: 72px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #e8edf3;
      background: #fff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
      display: grid;
      place-items: center;
      color: #64748b;
    }
    .frame {
      background: #fff;
      border-radius: 18px;
      height: 100%;
      min-height: 0;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, .03), 0 10px 30px rgba(15, 23, 42, .04);
      overflow: auto;
    }
    .pad { padding: 28px 32px 40px; }

    .list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
    .list-head p { margin: 6px 0 0; max-width: 640px; color: #94a3b8; font-size: 14px; line-height: 1.45; }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      min-width: 260px;
      padding: 0 12px;
      border: 1px solid #e6ebf2;
      border-radius: 10px;
      color: #94a3b8;
      background: #fff;
    }
    .search input { width: 100%; border: 0; color: var(--ink); background: transparent; }
    .search input:focus { outline: none; }
    .search:focus-within { border-color: #bfd3f7; box-shadow: 0 0 0 3px rgba(47, 111, 224, .12); }
    .count { margin: 18px 0 8px; color: #94a3b8; font-size: 13px; }

    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: #98a2b3;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    td { padding: 14px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14.5px; vertical-align: middle; color: #475569; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafc; }
    .strong { font-weight: 600; color: #111827; }
    .target { font-weight: 600; color: #1e3a5f; }
    .gap-note { margin-top: 2px; font-size: 12px; font-weight: 600; }
    .gap-note.bad { color: var(--down); }
    .gap-note.ok { color: #059669; }
    th:last-child, td:last-child { text-align: right; }
    .actions { display: inline-flex; gap: 6px; }
    .table-wrap { overflow-x: auto; }

    .btn { border: 0; border-radius: 8px; height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .btn-view { background: #eaf1ff; color: var(--blue); }
    .btn-view:hover { background: #dce8ff; }
    .btn-edit { background: #f1f5f9; color: #475569; }
    .btn-edit:hover { background: #e2e8f0; }
    .btn-delete { background: #fff1f4; color: #e11d48; }
    .btn-delete:hover { background: #ffe4ea; }
    .btn-plan { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid #c9dafb; background: #fff; color: var(--blue); }
    .btn-plan.is-on { background: #ecfdf3; color: #047857; border-color: #bbf7d0; }

    .empty { padding: 56px 16px; text-align: center; }
    .empty h2 { margin: 0 0 6px; font-size: 18px; }
    .empty p { margin: 0 0 16px; color: var(--muted); }

    .detail-head { position: relative; min-height: 44px; padding: 4px 150px 0; text-align: center; }
    .back {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #e5eaf1;
      background: #fff;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }
    .back:hover { background: #f8fafc; }
    .detail-title { margin: 0 auto; max-width: 760px; color: var(--blue); font-size: 20px; line-height: 1.35; }
    .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.req { background: var(--cyan); }
    .dot.own { background: var(--gold); }

    .compat { display: grid; grid-template-columns: minmax(300px, 440px) minmax(320px, 1fr); gap: 8px 12px; align-items: center; margin-top: 28px; }
    .who { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
    .who strong { font-size: 16px; }
    .skill { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 2px; }
    .skill + .skill { border-top: 1px solid #eef2f6; }
    .skill-name { color: #334155; font-size: 14.5px; font-weight: 600; }
    .skill-type { margin-top: 2px; color: #94a3b8; font-size: 12px; }
    .score { display: inline-flex; align-items: center; gap: 4px; min-width: 42px; justify-content: flex-end; font-size: 18px; font-weight: 700; }
    .score.up { color: var(--up); }
    .score.down { color: var(--down); }
    .chart { display: flex; justify-content: center; }
    .chart svg { width: min(540px, 100%); height: auto; }
    .chart text { font-family: Inter, "Segoe UI", sans-serif; }
    .radar-label { font-size: 12px; fill: #64748b; }
    .radar-level { font-size: 11px; fill: #94a3b8; }

    .courses { margin-top: 28px; padding-top: 26px; border-top: 1px solid #eef2f6; }
    .courses h2 { margin: 0; font-size: 18px; }
    .lead { margin: 6px 0 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .aligned { margin: 0; padding: 16px 18px; border-radius: 12px; background: #f0fdf4; color: #166534; }
    .gap-card { margin-top: 12px; padding: 16px 18px 6px; border: 1px solid #e7edf4; border-radius: 14px; background: #fbfcfe; }
    .gap-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .gap-top h3 { margin: 0; font-size: 15px; }
    .priority { border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .priority.high { background: #fff1f4; color: var(--down); }
    .priority.mid { background: #fff7ed; color: #c2410c; }
    .delta { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .delta strong { color: #334155; }
    .course-rows { list-style: none; margin: 8px 0 0; padding: 0; }
    .course-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid #eef2f6; }
    .course-title { display: block; color: #1f2937; font-weight: 600; }
    .course-meta { display: block; margin-top: 3px; color: #94a3b8; font-size: 12.5px; }
    .residual { margin: 2px 0 10px; color: #b45309; font-size: 12.5px; }

    dialog { width: min(640px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 16px; box-shadow: 0 24px 80px rgba(15, 23, 42, .22); }
    dialog::backdrop { background: rgba(15, 23, 42, .45); }
    #confirm { width: min(440px, calc(100vw - 32px)); }
    .modal header { padding: 22px 22px 0; }
    .modal h2 { margin: 0; font-size: 18px; }
    .modal-lead { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .modal .body { padding: 16px 22px 22px; }
    .modal .body > p { margin: 0; color: #475569; line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .form-grid label, .skill-edit { color: #334155; font-size: 13px; font-weight: 600; }
    .form-grid label { display: flex; flex-direction: column; gap: 6px; }
    .span-2 { grid-column: span 2; }
    .form-grid input, .form-grid select, .skill-edit select {
      height: 40px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0 12px;
      background: #fff;
      color: #0f172a;
      font-weight: 500;
    }
    .edit-sub { margin: 20px 0 0; font-size: 14px; }
    .skill-edit { display: grid; grid-template-columns: 1fr 88px auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #eef2f6; font-weight: 500; }
    .req-hint { color: var(--muted); font-size: 12px; font-weight: 500; }
    .form-error { margin: 10px 0 0; color: #e11d48; font-size: 13px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .help-tab {
      position: fixed;
      right: 0;
      top: 46%;
      z-index: 4;
      padding: 12px 7px;
      border-radius: 8px 0 0 8px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .help-bubble {
      position: fixed;
      right: 14px;
      bottom: 18px;
      z-index: 4;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #2563eb;
      color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, .35);
    }

    @media (max-width: 980px) {
      .sidebar { display: none; }
      .workspace { height: auto; padding: 64px 16px 16px; }
      .gear { right: 16px; }
      .frame { height: auto; min-height: calc(100vh - 88px); overflow: visible; }
      html, body, .app { height: auto; overflow: visible; }
      .compat, .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .detail-head { padding-top: 52px; }
      .help-tab, .help-bubble { display: none; }
      .list-head { flex-direction: column; }
      .search { width: 100%; }
    }
  </style>
</head>

      { id: "sara", firstName: "Sara", lastName: "Conti", role: "Data Analyst", potentialRole: "Analytics Lead", color: "#10b981", levels: { analisi: 5, comunicazione: 3, prodotto: 4, team: 2, negoziazione: 2, pianificazione: 3 } },
      { id: "luca", firstName: "Luca", lastName: "Greco", role: "Support Specialist", potentialRole: "Customer Success Manager", color: "#6366f1", levels: { analisi: 3, comunicazione: 5, prodotto: 4, team: 2, negoziazione: 2, pianificazione: 4 } },
      { id: "elena", firstName: "Elena", lastName: "Vitale", role: "Team Coordinator", potentialRole: "Operations Manager", color: "#ec4899", levels: { analisi: 4, comunicazione: 4, prodotto: 3, team: 4, negoziazione: 3, pianificazione: 5 } }
    ];

    const state = { view: "list", personId: null, query: "", planned: {}, deletingId: null };
    let people = structuredClone(SEED);

    const frame = document.getElementById("frame");
    const editor = document.getElementById("editor");
    const confirmBox = document.getElementById("confirm");

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function polar(cx, cy, radius, index, count) {
      const angle = -Math.PI / 2 + (2 * Math.PI * index) / count;
      return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
    }

    function shortLabel(name) {
      return name.length > 18 ? name.slice(0, 17).trimEnd() + "…" : name;
    }

    function initials(person) {
      return (person.firstName[0] + person.lastName[0]).toUpperCase();
    }

    function gapItems(person) {
      const required = ROLE_PROFILES[person.potentialRole];
      return SKILLS.map((skill) => ({
        skill,
        have: person.levels[skill.id],
        need: required[skill.id],
        gap: Math.max(0, required[skill.id] - person.levels[skill.id])
      })).filter((item) => item.gap > 0);
    }

    function coursesFor(item) {
      const picked = [];
      let remaining = item.gap;
      for (const course of COURSE_CATALOG[item.skill.id]) {
        if (remaining <= 0) break;
        picked.push(course);
        remaining -= course.covers;
      }
      return picked;
    }

    function filteredPeople() {
      const query = state.query.trim().toLowerCase();
      if (!query) return people;
      return people.filter((person) =>
        [person.firstName, person.lastName, person.role, person.potentialRole].join(" ").toLowerCase().includes(query)
      );
    }

    function listShell() {
      return `<div class="pad" data-screen="list">
        <div class="list-head">
          <div>
            <h1>Piani di carriera</h1>
            <p>Persone, ruolo attuale e ruolo potenziale. Apri un profilo per il confronto e i corsi sui gap.</p>
          </div>
          <label class="search">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Cerca persona o ruolo" value="${esc(state.query)}" autocomplete="off">
          </label>
        </div>
        <p class="count" id="count"></p>
        <div class="table-wrap" id="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Ruolo</th>
                <th>Ruolo potenziale</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" hidden></div>
      </div>`;
    }

    function paintRows() {
      const rows = filteredPeople();
      const count = document.getElementById("count");
      const wrap = document.getElementById("table-wrap");
      const empty = document.getElementById("empty");
      const body = document.getElementById("rows");

      if (!people.length) {
        count.textContent = "Nessuna persona in elenco";
        wrap.hidden = true;
        empty.hidden = false;
        empty.innerHTML = `<h2>Nessun piano di carriera</h2><p>L'elenco è vuoto.</p><button class="btn btn-view" type="button" data-action="restore">Ripristina dati di esempio</button>`;
        return;
      }

      if (!rows.length) {
        count.textContent = `Nessun risultato per “${state.query.trim()}”`;
        wrap.hidden = true;
        empty.hidden = false;
        empty.innerHTML = `<h2>Nessuna persona trovata</h2><p>Prova con un altro nome o ruolo.</p>`;
        return;
      }

      wrap.hidden = false;
      empty.hidden = true;
      count.textContent = rows.length === 1 ? "1 persona" : `${rows.length} persone`;
      body.innerHTML = rows.map((person) => {
        const gaps = gapItems(person).length;
        const note = gaps === 0
          ? `<div class="gap-note ok">Allineato</div>`
          : `<div class="gap-note bad">${gaps} gap</div>`;
        return `<tr data-id="${esc(person.id)}">
          <td class="strong">${esc(person.firstName)}</td>
          <td class="strong">${esc(person.lastName)}</td>
          <td>${esc(person.role)}</td>
          <td><div class="target">${esc(person.potentialRole)}</div>${note}</td>
          <td><div class="actions">
            <button type="button" class="btn btn-view" data-action="view" data-id="${esc(person.id)}">Visualizza</button>
            <button type="button" class="btn btn-edit" data-action="edit" data-id="${esc(person.id)}">Modifica</button>
            <button type="button" class="btn btn-delete" data-action="delete" data-id="${esc(person.id)}">Elimina</button>
          </div></td>
        </tr>`;
      }).join("");
    }

    function radarSvg(person) {
      const required = ROLE_PROFILES[person.potentialRole];
      const cx = 280;
      const cy = 228;
      const radius = 128;
      const count = SKILLS.length;
      const ring = (level) => SKILLS.map((_, index) => polar(cx, cy, radius * level / 5, index, count).map((value) => value.toFixed(1)).join(",")).join(" ");
      const rings = [1, 2, 3, 4, 5].map((level) => `<polygon points="${ring(level)}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`).join("");
      const axes = SKILLS.map((_, index) => {
        const [x, y] = polar(cx, cy, radius, index, count);
        return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e7eb"/>`;
      }).join("");
      const shape = (values) => values.map((value, index) => polar(cx, cy, radius * value / 5, index, count).map((point) => point.toFixed(1)).join(",")).join(" ");
      const requiredShape = shape(SKILLS.map((skill) => required[skill.id]));
      const ownedShape = shape(SKILLS.map((skill) => person.levels[skill.id]));
      const labels = SKILLS.map((skill, index) => {
        const angle = -Math.PI / 2 + (2 * Math.PI * index) / count;
        const [x, y] = polar(cx, cy, radius + 30, index, count);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const anchor = cos > 0.4 ? "start" : cos < -0.4 ? "end" : "middle";
        const dy = sin > 0.45 ? 14 : sin < -0.45 ? -4 : 4;
        return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" class="radar-label">${esc(shortLabel(skill.name))}</text>`;
      }).join("");
      const levels = [1, 2, 3, 4, 5].map((level) => {
        const [x, y] = polar(cx, cy, radius * level / 5, 0, count);
        return `<text x="${(x - 14).toFixed(1)}" y="${(y - 2).toFixed(1)}" text-anchor="end" class="radar-level" stroke="#fff" stroke-width="4" paint-order="stroke">${level}</text>`;
      }).join("");
      return `<svg viewBox="0 0 560 460" role="img" aria-label="Radar delle competenze richieste e possedute">
        ${rings}${axes}
        <polygon points="${requiredShape}" fill="rgba(61,206,223,.38)" stroke="#2ec4e6" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="${ownedShape}" fill="rgba(242,193,75,.45)" stroke="#e0b02a" stroke-width="2" stroke-linejoin="round"/>
        ${labels}${levels}
      </svg>`;
    }

    function skillsHtml(person) {
      const required = ROLE_PROFILES[person.potentialRole];
      return SKILLS.map((skill) => {
        const have = person.levels[skill.id];
        const direction = have >= required[skill.id] ? "up" : "down";
        const arrow = direction === "up"
          ? `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 12.5V3.5M8 3.5 4.2 7.2M8 3.5l3.8 3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          : `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9M8 12.5l-3.8-3.7M8 12.5l3.8-3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        return `<div class="skill">
          <div><div class="skill-name">${esc(skill.name)}</div><div class="skill-type">${esc(skill.type)}</div></div>
          <div class="score ${direction}" aria-label="${direction === "up" ? "Sopra o in linea" : "Sotto il livello richiesto"}">${arrow}<span>${have}</span></div>
        </div>`;
      }).join("");
    }

    function coursesHtml(person) {
      const gaps = gapItems(person);
      if (!gaps.length) {
        return `<section class="courses">
          <h2>Corsi per colmare i gap</h2>
          <p class="aligned">Nessun corso necessario. ${esc(person.firstName)} copre le competenze richieste per ${esc(person.potentialRole)}.</p>
        </section>`;
      }

      const suggested = gaps.flatMap(coursesFor);
      const hours = suggested.reduce((total, course) => total + course.hours, 0);
      const cards = gaps.map((item) => {
        const courses = coursesFor(item);
        const covered = courses.reduce((total, course) => total + course.covers, 0);
        const residual = item.gap - covered;
        const courseRows = courses.map((course) => {
          const added = !!state.planned[`${person.id}:${course.id}`];
          return `<li class="course-row">
            <div>
              <span class="course-title">${esc(course.title)}</span>
              <span class="course-meta">${course.hours} ore · ${esc(course.mode)} · copre 1 livello</span>
            </div>
            <button type="button" class="btn btn-plan${added ? " is-on" : ""}" data-action="plan" data-id="${esc(person.id)}" data-course="${esc(course.id)}">${added ? "Aggiunto" : "Aggiungi al piano"}</button>
          </li>`;
        }).join("");
        return `<article class="gap-card">
          <div class="gap-top">
            <span class="priority ${item.gap >= 2 ? "high" : "mid"}">${item.gap >= 2 ? "Priorità alta" : "Priorità media"}</span>
            <h3>${esc(item.skill.name)}</h3>
            <span class="skill-type">${esc(item.skill.type)}</span>
          </div>
          <p class="delta">Livello posseduto <strong>${item.have}</strong> · richiesto <strong>${item.need}</strong> · gap ${item.gap}</p>
          <ul class="course-rows">${courseRows}</ul>
          ${residual > 0 ? `<p class="residual">Dopo questi corsi resta ${residual} livello da consolidare sul campo.</p>` : ""}
        </article>`;
      }).join("");

      const competenceLabel = gaps.length === 1 ? "competenza sotto il livello" : "competenze sotto il livello";
      const courseLabel = suggested.length === 1 ? "corso suggerito" : "corsi suggeriti";
      return `<section class="courses">
        <h2>Corsi per colmare i gap</h2>
        <p class="lead">${gaps.length} ${competenceLabel} richiesto per ${esc(person.potentialRole)}. ${suggested.length} ${courseLabel} · ${hours} ore.</p>
        ${cards}
      </section>`;
    }

    function detailHtml(person) {
      return `<div class="pad" data-screen="detail">
        <header class="detail-head">
          <button type="button" class="back" data-action="back">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Indietro
          </button>
          <h1 class="detail-title">Compatibilità tra ${esc(person.firstName)} ${esc(person.lastName)} e ruolo ${esc(person.potentialRole)}</h1>
          <div class="legend">
            <span><i class="dot req"></i> Competenze richieste ruolo ${esc(person.potentialRole)}</span>
            <span><i class="dot own"></i> Competenze possedute da ${esc(person.firstName)} ${esc(person.lastName)}</span>
          </div>
        </header>
        <div class="compat">
          <div>
            <div class="who">
              <div class="avatar" style="background:${esc(person.color)}">${esc(initials(person))}</div>
              <strong>${esc(person.firstName)} ${esc(person.lastName)}</strong>
            </div>
            <div>${skillsHtml(person)}</div>
          </div>
          <div class="chart">${radarSvg(person)}</div>
        </div>
        ${coursesHtml(person)}
      </div>`;
    }

    function render() {
      if (state.view === "detail" && !people.some((person) => person.id === state.personId)) state.view = "list";
      if (state.view === "list") {
        if (!frame.querySelector("[data-screen='list']")) {
          frame.innerHTML = listShell();
          frame.scrollTop = 0;
          frame.querySelector("#search").addEventListener("input", (event) => {
            state.query = event.target.value;
            paintRows();
          });
        }
        paintRows();
        return;
      }
      const keepScroll = !!frame.querySelector("[data-screen='detail']");
      const scroll = frame.scrollTop;
      frame.innerHTML = detailHtml(people.find((person) => person.id === state.personId));
      frame.scrollTop = keepScroll ? scroll : 0;
    }

    function openDetail(id) {
      state.view = "detail";
      state.personId = id;
      render();
    }

    function openEditor(id) {
      const person = people.find((item) => item.id === id);
      if (!person) return;
      const roleOptions = Object.keys(ROLE_PROFILES).map((role) =>
        `<option value="${esc(role)}"${role === person.potentialRole ? " selected" : ""}>${esc(role)}</option>`
      ).join("");
      const required = ROLE_PROFILES[person.potentialRole];
      const skillFields = SKILLS.map((skill) => {
        const options = [1, 2, 3, 4, 5].map((level) =>
          `<option value="${level}"${level === person.levels[skill.id] ? " selected" : ""}>${level}</option>`
        ).join("");
        return `<div class="skill-edit">
          <div><div class="skill-name">${esc(skill.name)}</div><div class="skill-type">${esc(skill.type)}</div></div>
          <select name="${skill.id}" aria-label="Livello posseduto di ${esc(skill.name)}">${options}</select>
          <span class="req-hint">Richiesto <strong data-required="${skill.id}">${required[skill.id]}</strong></span>
        </div>`;
      }).join("");
      editor.innerHTML = `<form class="modal" id="edit-form" data-id="${esc(person.id)}">
        <header>
          <h2>Modifica piano di carriera</h2>
          <p class="modal-lead">Aggiorna anagrafica, ruolo potenziale e livelli posseduti.</p>
        </header>
        <div class="body">
          <div class="form-grid">
            <label>Nome <input name="firstName" required value="${esc(person.firstName)}"></label>
            <label>Cognome <input name="lastName" required value="${esc(person.lastName)}"></label>
            <label class="span-2">Ruolo <input name="role" required value="${esc(person.role)}"></label>
            <label class="span-2">Ruolo potenziale <select name="potentialRole">${roleOptions}</select></label>
          </div>
          <h3 class="edit-sub">Competenze possedute</h3>
          <div>${skillFields}</div>
          <p class="form-error" hidden>Compila nome, cognome e ruolo.</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-edit" data-action="close-editor">Annulla</button>
            <button type="submit" class="btn btn-view">Salva</button>
          </div>
        </div>
      </form>`;
      if (editor.open) editor.close();
      editor.showModal();
    }

    function openConfirm(id) {
      const person = people.find((item) => item.id === id);
      if (!person) return;
      state.deletingId = id;
      confirmBox.innerHTML = `<div class="modal">
        <header><h2>Elimina piano</h2></header>
        <div class="body">
          <p>Vuoi eliminare il piano di carriera di <strong>${esc(person.firstName)} ${esc(person.lastName)}</strong>?</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-edit" data-action="cancel-delete">Annulla</button>
            <button type="button" class="btn btn-delete" data-action="confirm-delete">Elimina</button>
          </div>
        </div>
      </div>`;
      if (confirmBox.open) confirmBox.close();
      confirmBox.showModal();
    }

    frame.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (button) {
        const { action, id, course } = button.dataset;
        if (action === "view") openDetail(id);
        else if (action === "edit") openEditor(id);
        else if (action === "delete") openConfirm(id);
        else if (action === "back") {
          state.view = "list";
          render();
        } else if (action === "restore") {
          people = structuredClone(SEED);
          state.query = "";
          state.planned = {};
          state.view = "list";
          state.personId = null;
          frame.innerHTML = "";
          render();
        } else if (action === "plan") {
          const key = `${id}:${course}`;
          if (state.planned[key]) delete state.planned[key];
          else state.planned[key] = true;
          render();
        }
        return;
      }
      const row = event.target.closest("tr[data-id]");
      if (row) openDetail(row.dataset.id);
    });

    editor.addEventListener("close", () => { editor.innerHTML = ""; });
    confirmBox.addEventListener("close", () => { confirmBox.innerHTML = ""; });

    editor.addEventListener("click", (event) => {
      if (event.target === editor || event.target.closest("[data-action='close-editor']")) editor.close();
    });

    editor.addEventListener("change", (event) => {
      if (event.target.name !== "potentialRole") return;
      const required = ROLE_PROFILES[event.target.value];
      SKILLS.forEach((skill) => {
        const node = editor.querySelector(`[data-required="${skill.id}"]`);
        if (node) node.textContent = required[skill.id];
      });
    });

    editor.addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const person = people.find((item) => item.id === form.dataset.id);
      if (!person) return;
      const firstName = form.firstName.value.trim();
      const lastName = form.lastName.value.trim();
      const role = form.role.value.trim();
      const error = form.querySelector(".form-error");
      if (!firstName || !lastName || !role) {
        error.hidden = false;
        return;
      }
      person.firstName = firstName;
      person.lastName = lastName;
      person.role = role;
      person.potentialRole = form.potentialRole.value;
      SKILLS.forEach((skill) => {
        person.levels[skill.id] = Number(form.elements[skill.id].value);
      });
      editor.close();
      render();
    });

    confirmBox.addEventListener("click", (event) => {
      if (event.target === confirmBox || event.target.closest("[data-action='cancel-delete']")) confirmBox.close();
      if (!event.target.closest("[data-action='confirm-delete']")) return;
      people = people.filter((person) => person.id !== state.deletingId);
      if (state.personId === state.deletingId) {
        state.view = "list";
        state.personId = null;
      }
      confirmBox.close();
      render();
    });

    render();
  </script>
</body>
</html>
